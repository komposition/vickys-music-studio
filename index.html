<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vicky's Music Studio — Where passion meets performance. Piano lessons and recitals in a nurturing environment.">
  <meta name="theme-color" content="#000000">
  
  <title>Vicky's Music Studio</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Vicky's Music Studio">
  <meta property="og:description" content="Where passion meets performance.">
  <meta property="og:type" content="website">
</head>
<body>
  <!-- Loader -->
  <div class="loader" aria-hidden="true">
    <span class="loader-text">Vicky's</span>
  </div>

  <!-- Video Hero -->
  <div class="video-hero">
    <video 
      autoplay 
      muted 
      loop 
      playsinline
      poster="assets/images/hero-poster.jpg"
    >
      <source src="assets/video/hero.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Navigation -->
  <nav class="nav" aria-label="Main navigation">
    <a href="index.html" class="nav-brand">Vicky's</a>
    
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </nav>

  <!-- Full Screen Menu -->
  <div class="menu" role="dialog" aria-label="Navigation menu">
    <ul class="menu-list">
      <li class="menu-item">
        <a href="recital.html" class="menu-link">Recital Program</a>
      </li>
      <li class="menu-item">
        <a href="about.html" class="menu-link">About</a>
      </li>
      <li class="menu-item">
        <a href="index.html" class="menu-link">Home</a>
      </li>
    </ul>
    
    <div class="menu-footer">
      <div class="menu-social">
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="menu-social-link">Facebook</a>
        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="menu-social-link">YouTube</a>
      </div>
    </div>
  </div>

  <!-- Hero Content -->
  <main class="hero">
    <!-- The Typography Moment -->
    <div class="hero-title">
      <div class="hero-title-line">
        <span class="hero-title-text hero-title-primary">Vicky's</span>
      </div>
      <div class="hero-title-line">
        <span class="hero-title-text hero-title-secondary">music</span>
      </div>
      <div class="hero-title-line">
        <span class="hero-title-text hero-title-tertiary">Studio</span>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="hero-bottom">
      <div class="hero-rule"></div>
      
      <nav class="hero-nav" aria-label="Quick links">
        <div class="hero-links">
          <a href="recital.html" class="hero-link hero-link--primary">Recital Program</a>
          <a href="about.html" class="hero-link">About</a>
        </div>
        
        <div class="hero-social">
          <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="hero-social-link" aria-label="Facebook">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </a>
          <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="hero-social-link" aria-label="YouTube">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </a>
        </div>
      </nav>
    </div>
  </main>

  <!-- Sound Toggle -->
  <button class="sound-toggle is-muted" aria-label="Toggle sound">
    <div class="sound-bars">
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
    </div>
  </button>

  <!-- Scripts -->
  <script src="js/main.js"></script>
</body>
</html>
